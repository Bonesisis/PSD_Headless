[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "psd-headless"
version = "1.0.0"
description = "Headless PSD-Vorlagen rendern und als PNG auf NAS-Speicher exportieren"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Luca-Gene Bonzel" }]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "Pillow>=10.0",
  "numpy>=1.24",
  "psd-tools[composite]>=1.23,<2",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "fonttools>=4.55,<5",
  "PyYAML>=6,<7",
  "python-dotenv>=1,<2",
  "openpyxl>=3.1,<4",
  "defusedxml>=0.7,<1",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "build>=1,<2"]

[tool.setuptools.package-data]
pshl = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[project.scripts]
psd-headless = "pshl.cli:main"

[tool.setuptools.packages.find]
include = ["pshl*"]
